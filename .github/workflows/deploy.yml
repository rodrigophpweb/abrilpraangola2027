name: 🚀 Deploy to Hetzner

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy Theme to Server
    runs-on: ubuntu-latest

    steps:
      - name: 🔑 Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: 🌐 Add server to known hosts
        run: |
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: 🚀 Deploy via git pull no servidor
        run: |
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'EOF'
            set -e

            THEME_PATH="/var/www/abrilpraangola.com/htdocs/wp-content/themes/abril-pra-angola"

            echo "📁 Acessando o diretório do tema..."
            cd $THEME_PATH

            echo "⬇️ Fazendo git pull..."
            git pull origin main

            echo "✅ Deploy concluído com sucesso!"
          EOF

      - name: ✅ Confirmar deploy
        run: |
          echo "🎉 Deploy finalizado!"
          echo "Branch: main"
          echo "Commit: ${{ github.sha }}"
          echo "Autor: ${{ github.actor }}"

